; Tween Menu for Oblivion - settings. The values here are the compiled defaults.

[Log]
; 0 trace, 1 debug, 2 info, 3 warn, 4 error
uLogLevel=2

[Keys]
; The tween menu's keys (Unreal key names). Select / View opens it on a controller, T on the keyboard - both were
; Wait's, and Wait is now one of the tween menu's options.
sGamepadKey=Gamepad_Special_Left
sKeyboardKey=T
; 1 = the Start button opens System instead of the Character page
bStartOpensSystem=1
; 1 = System always opens on its far-left page (Save & Load), not the page it was last left on
bSystemOpensFirstPage=1
