; Tween Menu - settings. The values here are the compiled defaults.

[Log]
; 0 trace, 1 debug, 2 info, 3 warn, 4 error
uLogLevel=2

[Layout]
; Alternative = one scrollable row of options, Classic = four categories
sLayout=Alternative

[Keys]
; The tween menu's default keys (Unreal key names). Once the game has started, change them on the game's own
; Controls page instead - the "Tween Menu" row under Menu.
sGamepadKey=Gamepad_Special_Left
sKeyboardKey=T
